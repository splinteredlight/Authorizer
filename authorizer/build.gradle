plugins {
    id 'com.android.application'
}

// Configuration-cache compatible git revision lookup
def gitRevision = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }

static def buildTime() {
    def df = new SimpleDateFormat("MM/dd/yyyy HH:mm:ss Z")
    return df.format(new Date())
}

android {
    namespace 'net.tjado.passwdsafe'

    compileSdk 37
    compileSdkMinor 2
    defaultConfig {
        applicationId 'net.tjado.passwdsafe'
        minSdk 26
        targetSdk 37
        versionCode 500
        versionName '0.5.0'

        buildConfigField 'String', 'BUILD_ID', "\"${gitRevision.get()}\""
        buildConfigField 'String', 'BUILD_DATE', "\"${buildTime()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        //Reference them in .xml files.
        resValue "string", "application_id", "${applicationId}"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString(),
                             "room.incremental":"true"]
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles += getDefaultProguardFile(
                    'proguard-android-optimize.txt')
            proguardFiles += 'proguard-rules.pro'
            proguardFiles += 'proguard-rules-debug.pro'
            testProguardFiles += getDefaultProguardFile(
                    'proguard-android-optimize.txt')
        }
        release {
            minifyEnabled true
            proguardFiles += getDefaultProguardFile(
                    'proguard-android-optimize.txt')
            proguardFiles += 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
    androidResources {
        localeFilters += ['de']
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            // Duplicate licence files shipped by BouncyCastle, Yubikit & co.
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md',
                         'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE',
                         'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    testOptions {
        animationsDisabled true
    }
}

if (project.file('../sign/sign.gradle').exists()) {
    apply from: '../sign/sign.gradle'
}

dependencies {
    def room_version = "2.8.4"
    def yubikey_version = "3.2.1"
    def espresso_version = "3.7.0"

    api 'androidx.annotation:annotation:1.10.0'
    api 'androidx.cardview:cardview:1.0.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.2'
    api 'androidx.gridlayout:gridlayout:1.0.0'
    api 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    api 'androidx.preference:preference:1.2.1'
    api 'com.google.android.material:material:1.14.0'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'

    implementation "com.yubico.yubikit:yubiotp:$yubikey_version"
    implementation "com.yubico.yubikit:android:$yubikey_version"

    // AndroidTreeView declares 2014 support libraries it does not actually
    // reference from code; exclude them so only AndroidX is on the classpath.
    implementation('com.github.bmelnychuk:atv:1.2.9') {
        exclude group: 'com.android.support'
    }
    // Record icons are stored by name in the .psafe3 file, so the same icon
    // fonts must stay available. Iconics 5 is AndroidX-native (no Jetifier).
    implementation 'com.mikepenz:iconics-core:5.6.0'
    implementation 'com.mikepenz:iconics-views:5.6.0'
    implementation 'com.mikepenz:material-design-iconic-typeface:2.2.0.10-kotlin@aar'
    implementation 'com.mikepenz:devicon-typeface:5.1.0@aar'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'org.bouncycastle:bcpg-jdk18on:1.85'
    // CameraX for OTP QR scanning (replaces the abandoned Fotoapparat)
    def camerax_version = "1.6.2"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.zxing:core:3.5.4'

    // Root shell for the one-time USB HID gadget preparation
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // FIDO (WebAuthn/U2F) dependencies
    implementation 'co.nstant.in:cbor:0.9'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.1-android'
    implementation 'rocks.xmpp:precis:1.1.0'

    implementation "androidx.room:room-runtime:$room_version"

    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Core library
    androidTestImplementation 'androidx.test:core:1.7.0'

    // AndroidJUnitRunner and JUnit Rules
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'

    // Assertions
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:truth:1.7.0'
    androidTestImplementation 'com.google.truth:truth:1.4.4'

    // Espresso dependencies
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$espresso_version"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$espresso_version"
    androidTestImplementation "androidx.test.espresso:espresso-accessibility:$espresso_version"
    androidTestImplementation "androidx.test.espresso:espresso-web:$espresso_version"
    androidTestImplementation "androidx.test.espresso.idling:idling-concurrent:$espresso_version"

    // The following Espresso dependency can be either "implementation"
    // or "androidTestImplementation", depending on whether you want the
    // dependency to appear on your APK's compile classpath or the test APK
    // classpath.
    androidTestImplementation "androidx.test.espresso:espresso-idling-resource:$espresso_version"
}
